<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منصة امتحان أونلاين — أنشئ امتحانات إلكترونية في دقائق مع تصحيح تلقائي فوري. اختيار من متعدد، صح وخطأ، ومقالي." />
    <meta name="theme-color" content="#f26b38" />
    <title>امتحان أونلاين — منصة الامتحانات الإلكترونية</title>
    <script>
      // Apply saved theme before rendering to prevent flash
      const theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
